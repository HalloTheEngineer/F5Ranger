name: Build and Release F5Ranger

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from fabric.mod.json
        id: get_version
        run: |
          # Use jq to pull the version string from the json file
          VERSION=$(jq -r '.version' src/main/resources/fabric.mod.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew remapJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f5ranger-build
          path: build/libs/*.jar

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: f5ranger-build
          path: ./artifacts

      - name: Read mod info
        id: mod-info
        run: |
          MOD_NAME=$(jq -r '.name' src/main/resources/fabric.mod.json)
          echo "mod-name=$MOD_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the version extracted in the build job for the tag
          tag_name: v${{ needs.build.outputs.version }}
          name: ${{ steps.mod-info.outputs.mod-name }} ${{ needs.build.outputs.version }}
          files: ./artifacts/*.jar
          draft: false
          # Explicitly set to false to ensure non-pre-release
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}