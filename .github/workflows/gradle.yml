name: Build and Release F5Ranger

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: HalloTheEngineer/F5Ranger/.github/workflows/release.yml@main
    with:
      java-version: "25"
      make-latest: true
    secrets: inherit
