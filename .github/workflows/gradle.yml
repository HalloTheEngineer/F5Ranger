name: Build and Release F5Ranger

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to check tags/releases
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog and tags

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src/main/resources/fabric.mod.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_tag
        run: |
          if gh release view v${{ steps.get_version.outputs.version }} >/dev/null 2>&1; then
            echo "Release v${{ steps.get_version.outputs.version }} already exists. Skipping release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew remapJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f5ranger-build
          path: build/libs/*.jar

  release:
    # Only run if on main AND the version doesn't exist yet
    if: github.ref == 'refs/heads/main' && needs.build.outputs.exists == 'false'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: f5ranger-build
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: F5Ranger ${{ needs.build.outputs.version }}
          files: ./artifacts/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true # This automatically bundles all "stashed" commits into the notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}